  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rder-radius:6px;font-size:15px;font-family:inherit;background:#fff;color:#1F2A24\">\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ step2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <label for=\"f-user\" style=\"font-size:13px;font-weight:500;color:#55615A\">Username<\u002Flabel>\n                <input id=\"f-user\" type=\"text\" value=\"{{ user }}\" sc-camel-on-input=\"{{ onUser }}\" placeholder=\"Masukkan Username\" style=\"height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #D5DBD7;border-radius:6px;font-size:15px;font-family:inherit;background:#fff;color:#1F2A24\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <label for=\"f-pw\" style=\"font-size:13px;font-weight:500;color:#55615A\">Password<\u002Flabel>\n                <div style=\"display:flex;align-items:center;height:48px;box-sizing:border-box;border:1px solid #D5DBD7;border-radius:6px;padding-right:2px\">\n                  <input id=\"f-pw\" type=\"{{ pwType }}\" value=\"{{ pw }}\" sc-camel-on-input=\"{{ onPw }}\" placeholder=\"Masukkan Password\" style=\"flex:1;min-width:0;height:44px;border:0;background:transparent;padding:0 14px;font-size:15px;font-family:inherit;color:#1F2A24\">\n                  <button sc-camel-on-click=\"{{ togglePw }}\" aria-label=\"Tampilkan atau sembunyikan password\" style=\"width:44px;height:44px;border:0;background:transparent;cursor:pointer;color:#55615A;display:flex;align-items:center;justify-content:center\">\n                    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" ound:#FDECEC;border-radius:6px;padding:10px 12px\">{{ err }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ step1 }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ next }}\" style=\"min-height:48px;border:0;border-radius:6px;background:#0F1F17;color:#fff;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer\">Lanjutkan<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ step2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <button sc-camel-on-click=\"{{ login }}\" style=\"min-height:48px;border:0;border-radius:6px;background:#00873F;color:#fff;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer\">Login<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;font-weight:600;color:#00873F\">\n            <a class=\"lnk\" href=\"#faq\">Forgot Password ?<\u002Fa>\n            <a class=\"lnk\" href=\"#faq\">Download Soft Token<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- KOMITMEN / ANGKA -->\n  <section id=\"komitmen\" style=\"background:#0A3D24;color:#fff;padding:88px 64px;display:flex;flex-wrap:wrap;gap:56px;align-items:center\">\n    <div style=\"flex:1 1 360px;min-width:0;max-width:520px;display:flex;flex-direction:column;gap:16px\">\n      <h2 style=\"margin:0;font-size:36px;line-height:1.2;font-weight:600\">Bisnis maju lebih pesat bersama CMS Corporate<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.7;color:#C9DDD1\">CMS Corporate Bank Kalteng membantu perusahaan menjalankan operasional keuangan dengan aman dan nyaman, dari saldo harian sampai pembayaran massal.<\u002Fp>\n      <p style=\"margin:0;font-size:12px;color:#9FC0AE\">Angka pada halaman ini adalah data contoh.<\u002Fp>\n    <\u002Fdiv>\n    <div sty 15px;line-height:1.7;color:#55615A\">{{ shot.desc }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SOLUSI -->\n  <section style=\"padding:96px 64px;background:#fff;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"max-width:700px;display:flex;flex-direction:column;gap:10px\">\n      <h2 style=\"margin:0;font-size:34px;line-height:1.2;font-weight:600\">Solusi lengkap untuk kebutuhan perbankan perusahaan<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.7;color:#55615A\">Satu portal, satu login, banyak pilihan layanan untuk memajukan bisnis Anda.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n      <sc-for list=\"{{ solutions }}\" as=\"m\" hint-placeholder-count=\"4\">\n        <div style=\"background:#F3F8F5;border:1px solid #DCE8E0;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:10px\">\n          <h3 style=\"margin:0;font-size:17px;font-weight:600;color:#00673A\">{{ m.title }}<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;line-height:1.7;color:#55615A\">{{ m.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LENGKAPI BISNIS -->\n  <section style=\"padding:88px 64px;background:#F3F8F5;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"max-width:700px;display:flex;flex-direction:column;gap:10px\">\n      <h2 style=\"margin:0;font-size:34px;line-height:1.2;font-weight:600\">Lengkapi bisnis Anda dengan layanan keuangan terintegrasi<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.7;color:#55615A\">Jelajahi layanan CMS Corporate yang bisa disesuaikan dengan kebutuhan perusahaan.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n      <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div style=\"min-height:320px;background:#0A3D24;co >\n      <sc-if value=\"{{ play }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 40px 0;box-sizing:border-box\">\n          <div style=\"flex:1;display:flex;align-items:flex-end;justify-content:center;gap:14px;padding-bottom:8px\">\n            <div class=\"anim\" style=\"width:36px;height:40%;background:#2E9460;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 1.4s ease-out both\"><\u002Fdiv>\n            <div class=\"anim\" style=\"width:36px;height:62%;background:#2E9460;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 1.4s ease-out 0.15s both\"><\u002Fdiv>\n            <div class=\"anim\" style=\"width:36px;height:52%;background:#2E9460;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 1.4s ease-out 0.3s both\"><\u002Fdiv>\n            <div class=\"anim\" style=\"width:36px;height:80%;background:#00A651;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 1.4s ease-out 0.45s both\"><\u002Fdiv>\n            <div class=\"anim\" style=\"width:36px;height:95%;background:#00A651;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 1.4s ease-out 0.6s both\"><\u002Fdiv>\n            <div class=\"anim\" style=\"width:36px;height:72%;background:#2E9460;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 1.4s ease-out 0.75s both\"><\u002Fdiv>\n            <div class=\"anim\" style=\"width:36px;height:100%;background:#F5B800;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 1.4s ease-out 0.9s both\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:64px;font-size:22px;font-weight:600\">\n            <span class=\"anim\" style=\"position:absolute;left:0;right:0;top:8px;opacity:0;animation:cap 12s linear infinite both\">Pantau saldo semua rekening dalam satu layar<\u002Fspan>\n            <span class=\"anim\" style=\"position:absolu =\"Tampilan {{ i.title }}\" style=\"max-width:100%;max-height:100%;display:block\"><\u002Fdiv>\n          <div style=\"padding:20px;display:flex;flex-direction:column;gap:6px\">\n            <h3 style=\"margin:0;font-size:16px;font-weight:600\">{{ i.title }}<\u002Fh3>\n            <p style=\"margin:0;font-size:14px;line-height:1.6;color:#55615A\">{{ i.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- BERITA -->\n  <section id=\"berita\" style=\"padding:88px 64px;background:#fff;display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <h2 style=\"margin:0;font-size:32px;font-weight:600\">Berita terbaru<\u002Fh2>\n        <p style=\"margin:0;font-size:15px;color:#55615A\">Temukan berita dan artikel seputar CMS Corporate.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"#berita\" style=\"border:1px solid #00873F;color:#00873F;font-weight:600;font-size:14px;padding:11px 20px;border-radius:6px\">Lihat selengkapnya<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px\">\n      <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"4\">\n        <a href=\"#berita\" style=\"display:flex;flex-direction:column;gap:12px\">\n          <img src=\"{{ n.img }}\" alt=\"\" style=\"width:100%;height:140px;object-fit:cover;border-radius:8px;display:block\">\n          <div style=\"font-size:15px;line-height:1.5;font-weight:500\">{{ n.title }}<\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section id=\"faq\" style=\"padding:88px 64px;background:#F3F8F5;display:flex;flex-wrap:wrap;gap:48px\">\n    <h2 style=\"flex:1 1 280px;max-width:360px;margin:0;font-size:32px;line-height:1.25;font-weight:600\">Pertany 002Fdiv>\n      <div style=\"flex:0 1 180px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:#C9DDD1\">\n        <div style=\"font-size:15px;font-weight:600;color:#fff;margin-bottom:4px\">Tentang Bank Kalteng<\u002Fdiv>\n        <a class=\"lnk\" href=\"https://www.bankkalteng.co.id/\">Tentang Kami<\u002Fa>\n        <a class=\"lnk\" href=\"https://www.bankkalteng.co.id/\">Lihat Cabang Lainnya<\u002Fa>\n        <a class=\"lnk\" href=\"#kontak\">Hubungi Kami<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"flex:0 1 200px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:#C9DDD1\">\n        <div style=\"font-size:15px;font-weight:600;color:#fff;margin-bottom:4px\">Layanan Kami<\u002Fdiv>\n        <a class=\"lnk\" href=\"#kontak\">Limit Transaksi<\u002Fa>\n        <a class=\"lnk\" href=\"#kontak\">Info Kurs<\u002Fa>\n        <a class=\"lnk\" href=\"#kontak\">Panduan CMS<\u002Fa>\n        <a class=\"lnk\" href=\"#kontak\">Syarat &amp; Ketentuan<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 300px;max-width:380px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.7;color:#C9DDD1\">\n        <div style=\"font-size:15px;font-weight:600;color:#fff;margin-bottom:4px\">Perizinan dan Pengawasan<\u002Fdiv>\n        <div>Bank Kalteng berizin dan diawasi oleh OJK dan BI serta merupakan peserta Penjaminan LPS. Maksimum nilai simpanan yang dijamin LPS per nasabah per bank adalah Rp2 miliar. Untuk mengetahui tingkat bunga penjaminan LPS dapat diakses <a class=\"lnk\" href=\"https://www.bankkalteng.co.id/\" style=\"color:#F5B800;font-weight:600\">di sini<\u002Fa>.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #1C5A3A;padding-top:20px;font-size:13px;color:#9FC0AE\">© 2026 PT Bank Pembangunan Daerah Kalimantan Tengah.<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;h gan template siap pakai.', shot: 5 },\n      { title: 'Liquidity Manajemen', body: 'Atur batch likuiditas dengan limit bawah dan limit atas.', shot: 7 },\n      { title: 'Payment MPN', body: 'Bayar penerimaan negara menggunakan kode billing.', shot: 6 },\n      { title: 'Status Transaksi', body: 'Pantau dan cetak status transaksi ke Excel atau PDF.', shot: 8 },\n      { title: 'Transfer ke Bank Lain', body: 'Kirim lewat RTGS, SKN, atau BI Fast sesuai kebutuhan.', shot: 3 }\n    ];\n    const faqData = [\n      { q: 'Bagaimana jika saya lupa password?', a: 'Pilih Forgot Password di halaman login lalu ikuti petunjuknya. Kata sandi baru dikirim ke email yang terdaftar atas nama pengguna.' },\n      { q: 'Bagaimana cara mengunduh soft token?', a: 'Pilih Download Soft Token di halaman login dan ikuti langkah aktivasi. Soft token dipasang di ponsel dan dipakai untuk menyetujui transaksi.' },\n      { q: 'Siapa yang bisa mendaftar CMS Corporate?', a: 'Perusahaan yang memiliki rekening di Bank Kalteng, dengan dokumen perusahaan yang lengkap dan penunjukan administrator.' },\n      { q: 'Ke mana saya menghubungi bantuan?', a: 'Hubungi pusat bantuan di (0536) 000-0000 atau kirim email ke cms@contoh-bankkalteng.co.id.' }\n    ];\n    return {\n      step1: false, step2: true,\n      done: s.done, showForm: !s.done,\n      hasErr: !!s.err, err: s.err,\n      company: s.company, user: s.user, pw: s.pw, captcha: s.captcha, captchaIn: s.captchaIn,\n      pwType: s.showPw ? 'text' : 'password',\n      onCompany: (e) => this.setState({ company: e.target.value, err: '' }),\n      onUser: (e) => this.setState({ user: e.target.value, err: '' }),\n      onPw: (e) => this.setState({ pw: e.target.value, err: '' }),\n      onCaptcha: (e) => this.setState({ captchaIn: e.target.value, err: '' }),\n      refreshCaptcha: () => this.setState({ captcha: this.makeCaptcha(), captchaIn: '' }),\n      togglePw: () => this.setState({ showPw: !s.showPw }),\n      next: () => {\n        if (!s.company.trim()) { this.setState({ err: 'Masukkan Company ID untuk melanjutkan.' }); return; }\n        if (s.company.trim().toUpperCase() !== 'KALTENG01') { this.setState({ err: 'Company ID tidak ditemukan. Coba KALTENG01.' }); return; }\n        this.setState({ step: 2, err: '' });\n      },\n      back: () => this.setState({ step: 1, err: '', pw: '', captchaIn: '', captcha: this.makeCaptcha() }),\n      login: () => {\n        if (!s.company.trim()) { this.setState({ err: 'Masukkan Company ID.' }); return; }\n        if (!s.user.trim()) { this.setState({ err: 'Masukkan Username.' }); return; }\n        if (!s.pw) { this.setState({ err: 'Masukkan Password.' }); return; }\n        if (!s.captchaIn.trim()) { this.setState({ err: 'Masukkan kode captcha.' }); return; }\n        if (s.captchaIn.trim().toUpperCase() !== s.captcha) { this.setState({ err: 'Kode captcha tidak sesuai. Coba lagi dengan kode baru.', captcha: this.makeCaptcha(), captchaIn: '' }); return; }\n        if (s.company.trim().toUpperCase() !== 'KALTENG01' || s.user.trim() !== 'admin' || s.pw !== 'Admin123') { this.setState({ err: 'Company ID, username, atau password salah.', captcha: this.makeCaptcha(), captchaIn: '' }); return; }\n        this.setState({ done: true, err: '' });\n      },\n      reset: () => this.setState({ step: 1, company: '', user: '', pw: '', captchaIn: '', captcha: this.makeCaptcha(), showPw: false, err: '', done: false }),\n      heroShot: this.shots[0].src,\n      shot: this.shots[s.shot],\n      shotTabs: this.shots.map((x, i) => ({ title: x.title, bg: s.shot === i ? '#00873F' : '#FFFFFF', fg: s.shot === i ? '#FFFFFF' : '#1F2A24', go: () => this.setState({ shot: i }) })),\n      stats: [\n        { value: 'Rp 850 Miliar', label: 'Nilai transaksi harian' },\n        { value: '1.200+', label: 'Perusahaan pengguna' },\n        { value: '25 Ribu', label: 'Transaksi diproses per hari' },\n        { value: '14', label: 'Kabupaten dan kota terlayani' }\n      ],\n      solutions: [\n rporate akhir pekan ini', bg: '#D4E7DB', img: this.scene('gear') }\n      ],\n      faqs: faqData.map((f, i) => ({ q: f.q, a: f.a, open: s.faq === i, sign: s.faq === i ? '\\u2212' : '+', toggle: () => this.setState({ faq: s.faq === i ? -1 : i }) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
